<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>レビュー登録</title>
  <link rel="stylesheet" th:href="@{/css/style10.css}">
</head>
<body>

  <h2>レビュー登録</h2>

  <form action="@{/regist-review}" method="POST"
      th:object="${reviewRegistForm}">
      【店舗ID】
      <input type="text" th:field="*{restrantId}">

      【利用者ID】
      <input type="text" th:field="*{userId}">

      【来店日】
      <input type="text" th:field="*{visitDate}">

      【評価】
      <input type="text" th:field="*{rating}">

      【一言コメント】
      <input type="text" th:field="*{comment}">

      <input type="submit" value="登録"　class="btn">
  </form>

</body>
</html>
