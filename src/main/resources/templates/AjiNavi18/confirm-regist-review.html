<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>レビュー登録確認</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

	<h2>レビュー登録確認</h2>

	<table class="confirm-table" th:object="${reviewRegistForm}">
	<tr>
	    <td class="guide">【店舗】</td>
		<p th:text="*{restaurantId}"></p>
	</tr>
	<tr>
	   	<td class="guide">【利用者ID】</td>
	   	<p th:text="*{userId}"></p>
	</tr>
	   	<td class="guide">【来店日】</td>
	   	<p th:text="*{visitDate}"></p>
	<tr>
	   	<td class="guide">【評価】(1-5)</td>
	   	<p th:text="*{rating}"></p>
	</tr>
	<tr>
	   	<td class="guide">【一言コメント】</td>
	   	<p th:text="*{comment}"></p>
	</tr>
	</table>

    <form th:action="@{/confirm-regist-review}" method="POST"
			th:object="${reviewRegistForm}">
    	<input type="hidden" th:field="*{restaurantId}">
    	<input type="hidden" th:field="*{userId}">
    	<input type="hidden" th:field="*{visitDate}">
    	<input type="hidden" th:field="*{rating}">
    	<input type="hidden" th:field="*{comment}">
    	<input type="submit" value="登録実行" class="btn">
   	</form>

    <form th:action="@{/show-review-form-ret}" method="POST"
			th:object="${reviewRegistForm}">
    	<input type="hidden" th:field="*{restaurantId}">
    	<input type="hidden" th:field="*{userId}">
    	<input type="hidden" th:field="*{visitDate}">
    	<input type="hidden" th:field="*{rating}">
    	<input type="hidden" th:field="*{comment}" class="btn">
    	<input type="submit" value="もどる" class="btn">
   	</form>

</body>
</html>
